name: Dependabot auto-merge

# Queues routine Dependabot updates to merge themselves once CI passes. Majors are
# left alone: they are the ones that need a human to read a changelog.
#
# `pull_request_target` runs in the base-repo context, which is what grants the write
# access `gh pr merge` needs — Dependabot's own PR token is read-only. That trigger is
# only safe because this job never checks out or executes the PR's code; it reads
# metadata and calls the API. Do not add a checkout step here.
#
# This relies on a required status check being configured on the default branch. Without
# one, nothing blocks the PR and `--auto` merges it immediately, before CI has run.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Queue non-major updates for auto-merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          # Normal path: CI has only just been queued, so the required check is pending,
          # the PR is blocked, and auto-merge attaches and waits.
          if gh pr merge --auto --squash "$PR_URL"; then exit 0; fi

          # GitHub refuses to *enable* auto-merge on a PR with nothing left blocking it
          # ("Pull request is in clean status"). That means the gate we wanted to wait for
          # is already satisfied, so merging now is the same outcome -- but confirm that is
          # really why the call failed rather than merging on any error at all.
          state="$(gh pr view "$PR_URL" --json mergeStateStatus -q .mergeStateStatus)"
          echo "mergeStateStatus=$state"
          if [ "$state" != "CLEAN" ]; then
            echo "::error::auto-merge failed and the PR is not clean ($state); leaving it alone"
            exit 1
          fi
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
